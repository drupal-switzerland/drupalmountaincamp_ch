# Lagoon Nginx configuration for Decoupled Drupal + Nuxt
# Routing list adapted from the Liip starter's generated nginx config
# (lando/nginx/custom.conf in the original mountaincamp repo).

map $http_x_forwarded_host $proxy_x_forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

map $http_upgrade $proxy_connection {
  default upgrade;
  '' close;
}

upstream php_fpm {
  server 127.0.0.1:9000;
}

server {
  listen 8080;
  server_name localhost;
  server_name_in_redirect off;
  port_in_redirect off;
  large_client_header_buffers 4 32k;
  fastcgi_buffers 32 256k;
  fastcgi_buffer_size 512k;
  proxy_buffers 32 256k;
  proxy_buffer_size 128k;
  proxy_busy_buffers_size    256k;
  server_tokens off;

  root /app/drupal/docroot;
  index index.html index.htm;

  client_max_body_size 100M;

  location / {
    try_files $uri @frontend;
  }

  location @frontend {
    proxy_intercept_errors on;
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $proxy_connection;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
    # TLS terminates at the Lagoon ingress; pass its proto through instead of
    # this pod's plain-http $scheme so Drupal treats the session as secure.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location @drupal {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass php_fpm;
  }

  # GraphQL always goes to Drupal.
  location ~ ^(/(de|fr|it|en))?/graphql {
    try_files "" @drupal;
  }

  # Drupal admin/system path prefixes.
  location ~ ^(/(de|fr|it|en))?/(user|group|storage|api-docs|devel/|admin|run-cron|comment/|machine_name|big_pipe|autologout|autocomplete|contextual|editor|message|entity|webform|entity-browser|paragraphs_blokkli|facets|file/progress|filter|geocoder|quickedit|system/|layout_builder|block|linkit|masquerade|unmasquerade|media|media-library|scheduler|batch|cron|session|views|token|toolbar|modules|libraries|sites|themes/custom|themes/contrib|core|tmgmt|sitemap|translate|update.php) {
    try_files "" @drupal;
  }

  # Entity add forms.
  location ~ ^/((de|fr|it|en)/)?(node|taxonomy/term)/add {
    try_files "" @drupal;
  }

  # Entity edit/revisions/translations/delete forms.
  location ~ ^/((de|fr|it|en)/)?(node|taxonomy/term)/\d+/(add|edit|revisions|translations|delete|preview) {
    try_files "" @drupal;
  }

  location ~ \.php$ {
    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
    fastcgi_pass php_fpm;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    include fastcgi_params;
  }

  location ^~ /sites/default/files {
    try_files $uri $uri/ @drupal;
  }
}
