# Lagoon Nginx configuration for Decoupled Drupal + Nuxt
# Routing list adapted from the Liip starter's generated nginx config
# (lando/nginx/custom.conf in the original mountaincamp repo).

# Nuxt and Drupal build absolute URLs from this host, so a client-supplied
# X-Forwarded-Host is only passed on for the site's own hosts (the routes in
# .lagoon.yml, also listed in frontend/config/publicHosts.ts).
map $http_x_forwarded_host $proxy_x_forwarded_host {
    default                                        $host;
    "~*^(www\.|cfp\.)?drupalmountaincamp\.ch(:443)?$" $http_x_forwarded_host;
}

map $http_upgrade $proxy_connection {
  default upgrade;
  '' close;
}

upstream php_fpm {
  server 127.0.0.1:9000;
}

server {
  listen 8080;
  server_name localhost;
  server_name_in_redirect off;
  port_in_redirect off;
  large_client_header_buffers 4 32k;
  fastcgi_buffers 32 256k;
  fastcgi_buffer_size 512k;
  proxy_buffers 32 256k;
  proxy_buffer_size 128k;
  proxy_busy_buffers_size    256k;
  server_tokens off;

  root /app/drupal/docroot;
  index index.html index.htm;

  client_max_body_size 100M;

  # Inherited only by locations without an add_header of their own; the two
  # uploaded-SVG locations below repeat this list. Declaring any here drops the
  # base image's http-level X-LAGOON header, hence it is repeated.
  # Browsers ignore HSTS received over plain HTTP, so sending it always is safe.
  add_header X-LAGOON $hostname always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;

  location / {
    try_files $uri @frontend;
  }

  location @frontend {
    proxy_intercept_errors on;
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $proxy_connection;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
    # TLS terminates at the Lagoon ingress; pass its proto through instead of
    # this pod's plain-http $scheme so Drupal treats the session as secure.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location @drupal {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass php_fpm;
  }

  # Robots is served by Nuxt (frontend/public); exempt it from the .txt deny.
  location = /robots.txt {
    try_files $uri @frontend;
  }

  # Dotfiles and docroot text/meta files (README.md, .htaccess, ...) must not
  # be served from disk. These regexes must stay ahead of all other regexes.
  location ~ /\.(?!well-known) {
    deny all;
  }

  # Drupal-served private files and /.well-known/ (security.txt) keep these
  # extensions; only files on disk in the docroot are the concern here.
  location ~* ^(?!/((de|fr|it|en)/)?system/files/|/\.well-known/).*\.(md|txt|yml|yaml|lock|dist)$ {
    deny all;
  }

  # Static assets (jQuery, CKEditor5, gin theme, module/library files) must be
  # served from the Drupal docroot, not routed to php-fpm — Drupal's router
  # 404s them. Regex order matters: this must come before the admin-path list.
  # /sites/default/files is unaffected (^~ prefix match wins over regexes).
  # Files not on disk (e.g. /_nuxt/*) fall through to the frontend as before.
  location ~* \.(js|css|mjs|map|png|jpg|jpeg|gif|ico|svg|svgz|webp|avif|woff|woff2|ttf|eot|otf|mp4|webm)$ {
    try_files $uri @frontend;
  }

  # Uploaded SVG icons delivered by media_icon_deliver: same sandbox CSP as
  # uploaded SVGs under /sites/default/files. Must precede the admin path list.
  location ~ ^(/(de|fr|it|en))?/media/\d+/icon$ {
    add_header X-LAGOON $hostname always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox; frame-ancestors 'self'" always;
    # Passed to PHP here, not via @drupal: headers from a named location's
    # add_header would replace the ones above.
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass php_fpm;
  }

  # GraphQL always goes to Drupal.
  location ~ ^(/(de|fr|it|en))?/graphql(/|$) {
    try_files "" @drupal;
  }

  # Planet Drupal RSS feed (views.view.news feed_1).
  location = /news/planet_drupal.xml {
    try_files "" @drupal;
  }

  # Drupal admin/system path prefixes. Each entry must end at a segment
  # boundary, (/|$), so pages like /sessions or /media-partners still reach
  # the frontend. When a module adds routes under a new prefix, add it here.
  location ~ ^(/(de|fr|it|en))?/(user|group|storage|api-docs|devel|admin|run-cron|comment|machine_name|big_pipe|autologout|autocomplete|contextual|editor|message|entity|webform|entity-browser|paragraphs_blokkli|facets|file/progress|filter|geocoder|quickedit|system|layout_builder|block|linkit|masquerade|unmasquerade|media|media-library|scheduler|batch|cron|session|views|token|toolbar|modules|libraries|sites|themes/custom|themes/contrib|core|tmgmt|sitemap|sitemap\.xml|sitemaps|sitemap_generator|translate|update\.php|block-category|entity_browser|entity_reference_autocomplete|paragraphs_blokkli_graphql|views-bulk-operations|ckeditor5|comments|shs-term-data|shs-create-term|tablefield|api/ai-ckeditor|file/\d+/delete|\.well-known/change-password)(/|$) {
    try_files "" @drupal;
  }

  # Entity add forms and node preview.
  location ~ ^/((de|fr|it|en)/)?(node/add|taxonomy/term/add|node/preview)(/|$) {
    try_files "" @drupal;
  }

  # Entity edit, revision, translation, delete and latest-version routes.
  location ~ ^/((de|fr|it|en)/)?(node|taxonomy/term)/\d+/(add|edit|revisions?|translations|delete|preview|latest)(/|$) {
    try_files "" @drupal;
  }

  # Only the front controller executes. Drupal's other entry points
  # (core/*.php, update.php) are matched by the path list above first.
  location = /index.php {
    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
    fastcgi_pass php_fpm;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    include fastcgi_params;
  }

  location ~ \.php$ {
    return 404;
  }

  # Image derivatives and CSS/JS aggregates: cache in browsers for a day.
  # Derivatives generated on first request come from Drupal with its headers.
  location ^~ /sites/default/files {
    expires 1d;
    try_files $uri $uri/ @drupal;

    # The ^~ prefix skips the server-level dotfile rule (.htaccess lives here).
    location ~ /\. {
      deny all;
    }

    # Editors can upload SVGs; opened directly, any script in them would run
    # on this origin. The sandbox CSP does not affect <img> or <use> embeds.
    location ~* \.svgz?$ {
      add_header X-LAGOON $hostname always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox; frame-ancestors 'self'" always;
      try_files $uri @drupal;
    }
  }
}

server {
  listen 8080;
  server_name www.drupalmountaincamp.ch;
  add_header Strict-Transport-Security "max-age=31536000" always;
  return 301 https://drupalmountaincamp.ch$request_uri;
}
