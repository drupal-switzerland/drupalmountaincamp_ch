uuid: 3b8899c8-4bf3-40ba-abeb-263e97347797
langcode: de
status: true
dependencies:
  config:
    - filter.format.basic_html
  module:
    - ckeditor5
format: basic_html
editor: ckeditor5
settings:
  toolbar:
    items:
      - heading
      - bold
      - italic
      - '|'
      - link
      - anchor
      - '|'
      - bulletedList
      - numberedList
      - '|'
      - '|'
      - subscript
      - superscript
      - removeFormat
      - drupalInsertImage
      - code
      - insertTable
      - sourceEditing
      - '|'
      - style
  plugins:
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
    ckeditor5_imageResize:
      allow_resize: true
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: true
        styles: true
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<cite>'
        - '<dl>'
        - '<dt>'
        - '<dd>'
        - '<a hreflang>'
        - '<blockquote cite>'
        - '<h2 id>'
        - '<h3 id>'
        - '<h4 id>'
        - '<h5 id>'
        - '<h6 id>'
        - '<span>'
    ckeditor5_style:
      styles:
        -
          label: Label
          element: '<p class="label">'
        -
          label: Highlight
          element: '<span class="highlight">'
        -
          label: Button
          element: '<a class="button is-filled">'
        -
          label: 'Button (outline)'
          element: '<a class="button is-outline">'
    editor_advanced_link_link:
      enabled_attributes:
        - target
    linkit_extension:
      linkit_enabled: true
      linkit_profile: default
image_upload:
  status: false
