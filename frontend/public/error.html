      body {
        padding-top: 64px;
        padding-bottom: 64px;
        color: #fff;
        font-family: 'Noto Sans', sans-serif;

        background-color: #078976;
        text-align: center;
      }

      .logo {
        color: #fff;
      }
      .logo svg {
        height: 64px;
      }

      h1.title {
        font-size: 3.75rem;
        margin-bottom: 1rem;

        line-height: 1;
        font-weight: 700;
      }

      h2.subtitle {
        font-size: 3.75rem;
        margin-top: 0;
        line-height: 1;
        font-weight: 300;
      }

      .page-container {
        justify-content: center;
        align-items: center;
        flex-direction: column;
        min-height: 100vh;
        display: flex;
      }

      .error-container {
        gap: 40px;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        flex: 1 1 0%;
        display: flex;
      }

      .text {
        font-size: 1.125rem;
        line-height: 1.75rem;
      }

      .button {
        padding-bottom: 12px;
        padding-left: 32px;
        padding-right: 32px;
        padding-top: 12px;
        display: flex;
        box-sizing: border-box;
        color: #fff;
        background-color: #078976;
        border: 1px solid #fff;
        border-radius: 999px;
        text-decoration: none;
      }

      .button:hover {
        background-color: #078976;
      }
    </style>
  </head>
