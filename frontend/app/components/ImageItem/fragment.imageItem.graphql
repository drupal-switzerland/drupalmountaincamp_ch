fragment imageItem on FieldItemTypeImage {
  alt
  title
  # Drupal-generated derivative used when no rokka hash is available.
  wide: derivative(style: WIDE) {
    urlPath
    width
    height
  }
  file: entity {
    ...imageFile
  }
}

fragment imageFile on File {
  rokka: rokkaMetadata {
    ...imageRokkaMetadata
  }
  label
  uri
}

fragment imageRokkaMetadata on RokkaMetadata {
  hash
  sourceHeight: height
  sourceWidth: width
}
