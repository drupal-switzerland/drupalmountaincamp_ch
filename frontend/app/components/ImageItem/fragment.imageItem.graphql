fragment imageItem on FieldItemTypeImage {
  alt
  title
  # Drupal-generated derivatives used when no rokka hash is available,
  # combined into a srcset by ImageItem.
  large: derivative(style: LARGE) {
    urlPath
    width
    height
  }
  wide: derivative(style: WIDE) {
    urlPath
    width
    height
  }
  extraWide: derivative(style: EXTRA_WIDE) {
    urlPath
    width
    height
  }
  file: entity {
    ...imageFile
  }
}

fragment imageFile on File {
  rokka: rokkaMetadata {
    ...imageRokkaMetadata
  }
  label
  uri
}

fragment imageRokkaMetadata on RokkaMetadata {
  hash
  sourceHeight: height
  sourceWidth: width
}
