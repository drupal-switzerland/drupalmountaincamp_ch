# The two derivatives SponsorTile puts in its srcset; logos render at most
# 260px wide.
fragment sponsorLogo on FieldItemTypeImage {
  large: derivative(style: LARGE) {
    urlPath
    width
    height
  }
  wide: derivative(style: WIDE) {
    urlPath
    width
    height
  }
}

fragment nodeSponsor on NodeSponsor {
  uuid
  title
  year: fieldYear
  tier: fieldSponsorTier
  link: fieldLink {
    uri {
      path
    }
  }
  # The raw field returns the referenced entity as is, so the logo can be
  # Image or Icon (SVG) media.
  logo: fieldImageRawField {
    first {
      entity {
        ... on MediaImage {
          image: fieldMediaImage {
            ...sponsorLogo
          }
        }
        ... on MediaIcon {
          ...mediaIcon
        }
      }
    }
  }
}

# Every year, for the Sponsor List paragraph, which groups client-side.
query sponsorList {
  entityQuery(
    entityType: NODE
    limit: 500
    filter: {
      conditions: [
        { field: "type", value: ["sponsor"] }
        { field: "status", value: ["1"] }
      ]
    }
    sort: [
      { field: "field_year", direction: DESC }
      { field: "title", direction: ASC }
    ]
  ) {
    items {
      ... on NodeSponsor {
        ...nodeSponsor
      }
    }
  }
}

# One edition, for the footer and the homepage card on every page.
query sponsorsOfYear($year: String!) {
  entityQuery(
    entityType: NODE
    limit: 500
    filter: {
      conditions: [
        { field: "type", value: ["sponsor"] }
        { field: "status", value: ["1"] }
        { field: "field_year", value: [$year] }
      ]
    }
    sort: [{ field: "title", direction: ASC }]
  ) {
    items {
      ... on NodeSponsor {
        ...nodeSponsor
      }
    }
  }
}
