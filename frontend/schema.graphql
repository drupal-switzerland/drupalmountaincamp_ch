"""
A single blökkli notification for the current user.

Title and message are rendered at read time in the current request language by
the matching notification type plugin; they are never stored.
"""
type ParagraphsBlokkliNotification {
  """The notification UUID."""
  uuid: String!

  """Whether the current user has read this notification."""
  read: Boolean!

  """
  The creation time as an ISO 8601 UTC timestamp, e.g. 2026-05-28T14:32:18Z.
  """
  created: String!

  """The raw notification type id, e.g. "comment:mention"."""
  type: String!

  """The main, human readable text (plain)."""
  title: String!

  """Optional secondary line (plain)."""
  message: String

  """
  The user that triggered the event (mention author, resolver, ...), or null
  when there is no associated user or the account was deleted.
  """
  user: ParagraphsBlokkliUser

  """
  UUID of the entity this notification points at. Its meaning depends on the
  type (e.g. a comment UUID for comment:* notifications).
  """
  relatedEntityUuid: String

  """
  The host entity (page) the notification lives on, or null when the host was
  deleted or the notification has no host at all.
  """
  host: ParagraphsBlokkliHostEntity
}

"""A page of notifications for the current user."""
type ParagraphsBlokkliNotificationList {
  """The notifications for the requested page (newest first)."""
  items: [ParagraphsBlokkliNotification!]!

  """Total number of notifications across all pages."""
  total: Int!

  """Number of notifications returned per page."""
  perPage: Int!

  """
  The number of unread notifications for the current user, reflecting any
  marking applied by this query (see the markAsRead argument).
  """
  unreadCount: Int!

  """
  Opaque cursor for the next (older) page, or null when there are no more.
  Pass it back as the `after` argument. Stable against insertions/deletions.
  """
  nextCursor: String
}

