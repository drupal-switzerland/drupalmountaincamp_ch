"""Comment"""
interface Comment implements Entity & EntityLinkable {
  """Check entity access for the given operation, defaults to view."""
  accessCheck(operation: String): Boolean!

  """{value} {field: changed} The time that the comment was last edited."""
  changed: String

  """{field: changed} The time that the comment was last edited."""
  changedRawField: FieldItemListChanged

  """{value} {field: created} The time that the comment was created."""
  created: String

  """{field: created} The time that the comment was created."""
  createdRawField: FieldItemListCreated

  """The bundle ID of the entity."""
  entityBundle: String!

  """The entity type ID."""
  entityTypeId: String!
  id: String

  """Determines whether the entity is new."""
  isNew: Boolean!

  """The label of this entity."""
  label: String

  """The langcode of this entity."""
  langcode: String

  """{value} {field: uid} The user ID of the comment author."""
  uid: User

  """{field: uid} The user ID of the comment author."""
  uidRawField: FieldItemListEntityReference

  """Get the URL, defaults to canonical."""
  url(options: UrlOptions, rel: String): Url

  """The unique UUID."""
  uuid: String!
}

