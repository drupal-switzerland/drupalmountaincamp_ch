x-lagoon-project: &lagoon-project drupalmountaincamp-ch

x-volumes:
  &default-volumes
    volumes:
      - .:/app:delegated
      - files:/app/web/sites/default/files

x-environment:
  &default-environment
    LAGOON_PROJECT: *lagoon-project
    # Route that should be used locally, if you are using pygmy, this route *must* end with .docker.amazee.io
    LAGOON_ROUTE: &default-url http://${COMPOSE_PROJECT_NAME:-drupalmountaincamp}.docker.amazee.io
    # Uncomment if you like to have the system behave like in production
    #LAGOON_ENVIRONMENT_TYPE: production
    # Uncomment to enable xdebug and then restart via `docker-compose up -d`
    #XDEBUG_ENABLE: "true"

x-user:
  &default-user
    # The default user under which the containers should run. Change this if you are on linux and run with another user than id `1000`
    user: '1000'

volumes:
  files:
    {}
  db:
    {}
  search:
    {}

services:

  cli:
    build:
      context: .
      dockerfile: .lagoon/Dockerfile
      target: cli
    image: &cli-image ${COMPOSE_PROJECT_NAME:-drupalmountaincamp}-cli
    labels:
      lagoon.type: cli-persistent
      lagoon.persistent.name: nginx
      lagoon.persistent: /app/drupal/docroot/sites/default/files/
      lando.type: php-cli-drupal
    << : *default-volumes
    user: root
    volumes_from:
      - container:amazeeio-ssh-agent
    environment:
      << : *default-environment
      COMPOSER_MEMORY_LIMIT: -1
      WEBROOT: drupal/docroot

  php:
    build:
      context: .
      dockerfile: .lagoon/Dockerfile
      target: php
      args:
        CLI_IMAGE: *cli-image
      additional_contexts:
        cli: 'service:cli' # Ensure cli is built first
    labels:
      lagoon.type: nginx-php-persistent
      lagoon.name: nginx # we want this service be part of the nginx pod in Lagoon
      lagoon.persistent: /app/drupal/docroot/sites/default/files/ # define where the persistent storage should be mounted too
      lando.type: php-fpm
    << : [*default-volumes, *default-user]
    depends_on:
      - cli
    environment:
      << : *default-environment
      WEBROOT: drupal/docroot

  nginx:
    build:
      context: .
      dockerfile: .lagoon/Dockerfile
      target: nginx
      args:
        CLI_IMAGE: *cli-image # Inject the name of the cli image
      additional_contexts:
        cli: 'service:cli' # Ensure cli is built first
    labels:
      lagoon.type: nginx-php-persistent
      lagoon.persistent: /app/drupal/docroot/sites/default/files/
      lando.type: nginx-drupal
    ports:
      - "8080" # exposes the port 8080 with a random local port, find it with `docker compose port nginx 8080`
    << : [*default-volumes, *default-user]
    depends_on:
      - cli
    environment:
      << : *default-environment # loads the defined environment variables from the top
      LAGOON_LOCALDEV_URL: *default-url
    networks:
      - amazeeio-network
      - default

  mariadb:
    image: uselagoon/mariadb-10.11-drupal:latest
    labels:
      lagoon.type: mariadb
      lando.type: mariadb-drupal
    ports:
      - "3306" # exposes the port 3306 with a random local port, find it with `docker compose port mariadb 3306`
    << : *default-user # uses the defined user from top
    environment:
      << : *default-environment
    volumes:
      - db:/var/lib/mysql

  frontend:
    build:
      context: .
      dockerfile: .lagoon/Dockerfile
      target: frontend
    labels:
      lagoon.type: node
    environment:
      << : *default-environment
      NUXT_BACKEND_URL: http://nginx:8080
      NUXT_REQUEST_HOST: drupalmountaincamp-ch.lagoon.site
      NUXT_PORT: 3000
      NUXT_HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      HOST: 0.0.0.0

  elasticsearch:
    build:
      context: .
      dockerfile: .lagoon/Dockerfile
      target: elasticsearch
    labels:
      lagoon.type: elasticsearch
    << : *default-user # uses the defined user from top
    environment:
     << : *default-environment

  # memcached:
  #   image: memcached:1.6
  #   labels:
  #     lagoon.type: generic

networks:
  amazeeio-network:
    external: true
