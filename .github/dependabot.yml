version: 2
updates:
  - package-ecosystem: composer
    directory: /drupal
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Dependabot supports version updates for bun, not security updates or alerts.
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Tailwind 4 is a separate migration; eslint-plugin-tailwindcss 4 requires it.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-plugin-tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # The uselagoon images in .lagoon/Dockerfile share one release tag and move
  # together, so one pull request updates all of them.
  - package-ecosystem: docker
    directory: /.lagoon
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      lagoon-images:
        patterns:
          - "uselagoon/*"

  # docker-compose.yml: the local database image.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
