name: Drupal tests

on:
  pull_request:
    branches: [prod]
    paths:
      - 'drupal/**'
      - '.github/workflows/drupal-tests.yml'

permissions:
  contents: read

concurrency:
  group: drupal-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: drupal
    env:
      SIMPLETEST_DB: 'sqlite://localhost/:memory:'
      BROWSERTEST_OUTPUT_DIRECTORY: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same PHP version as the Lagoon images in .lagoon/Dockerfile.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('drupal/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - id: install
        run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpstan analyse docroot/modules/custom --no-progress

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vendor/bin/phpcs --standard=Drupal,DrupalPractice --extensions=php,inc,module,install,info,test,profile,theme docroot/modules/custom

      # ExistingSite tests need the site database, so they only run in ddev.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vendor/bin/phpunit docroot/modules/custom/blokkli_starterkit/tests/src/Unit

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vendor/bin/phpunit docroot/modules/custom/blokkli_starterkit/tests/src/Kernel
