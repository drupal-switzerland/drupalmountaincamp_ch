name: nginx config

on:
  pull_request:
    branches: [prod]

permissions:
  contents: read

# actions/checkout runs git init; without a default branch name git prints
# a 13-line hint about 'master' in every job.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: nginx-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nginx-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Lagoon provides basic_auth.conf at runtime and resolves the frontend
      # service, so the test stands in an empty file and a host entry.
      # Tested against the image the Dockerfile deploys, not a moving tag.
      - run: |
          image="$(awk '$1 == "FROM" && $2 ~ /^uselagoon\/nginx-drupal:/ { print $2 }' .lagoon/Dockerfile)"
          test -n "$image"
          touch "$RUNNER_TEMP/basic_auth.conf"
          docker run --rm --add-host frontend:127.0.0.1 \
            -v "$PWD/.lagoon/nginx-lagoon.conf:/etc/nginx/conf.d/app.conf:ro" \
            -v "$RUNNER_TEMP/basic_auth.conf:/etc/nginx/conf.d/basic_auth.conf:ro" \
            "$image" nginx -t

      # Response headers nginx adds, as a production and as a development
      # environment, against stub upstreams.
      - run: scripts/ci/nginx-headers.sh
