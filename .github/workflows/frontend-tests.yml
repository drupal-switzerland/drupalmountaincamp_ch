name: Frontend tests

on:
  pull_request:
    branches: [prod]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      # Same version as the ddev web container. The Lagoon build installs
      # bun@latest, so bump this when Lagoon picks up a new release.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run test:ci

  # The postinstall script runs `nuxt prepare`, which lint and typecheck need.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - id: install
        run: bun install --frozen-lockfile

      - run: bun run lint

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run prettier

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build
